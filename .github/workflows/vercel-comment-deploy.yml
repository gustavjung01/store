name: Manual Vercel deploy by PR comment

# No push, pull_request, or merge trigger: only an owner's exact comment.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: store-vercel-${{ github.event.comment.body == '/deploy production' && 'production' || 'preview' }}
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.issue.pull_request != null &&
      github.event.comment.user.login == 'gustavjung01' &&
      github.event.comment.author_association == 'OWNER' &&
      (github.event.comment.body == '/deploy preview' ||
       github.event.comment.body == '/deploy production')
    runs-on: ubuntu-latest
    # Configure a required reviewer on the "production" GitHub environment
    # before supplying production credentials.
    environment: ${{ github.event.comment.body == '/deploy production' && 'production' || 'preview' }}
    steps:
      - name: Check out reviewed main (never PR head)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false

      - name: Verify Vercel CLI version is pinned
        shell: bash
        env:
          VERCEL_CLI_VERSION: ${{ vars.VERCEL_CLI_VERSION }}
        run: |
          set -euo pipefail
          if [[ ! "$VERCEL_CLI_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Set VERCEL_CLI_VERSION to a reviewed exact version (e.g. N.N.N)."
            exit 1
          fi
          npm install --global "vercel@$VERCEL_CLI_VERSION"

      - name: Build and deploy to Vercel
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          COMMENT_COMMAND: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          for key in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::$key is not configured for this GitHub environment."
              exit 1
            fi
          done
          if [[ "$COMMENT_COMMAND" == "/deploy production" ]]; then
            vercel pull --yes --environment=production
            vercel build --prod
            vercel deploy --prebuilt --prod
          else
            vercel pull --yes --environment=preview
            vercel build
            vercel deploy --prebuilt
          fi
          echo "Deployed source commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Command: $COMMENT_COMMAND" >> "$GITHUB_STEP_SUMMARY"
