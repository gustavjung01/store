name: Build STORE Android APK

on:
  pull_request:
    branches: [main]
    paths: ['android/**', '.github/workflows/android-apk.yml', 'docs/ANDROID_APK.md']
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android-apk.yml', 'docs/ANDROID_APK.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35 (hosted runner)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable Android APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - name: Stage artifact
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/store-android-test.apk
          sha256sum dist/store-android-test.apk > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: store-android-apk
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Publish test APK to GitHub Releases
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="android-$(echo "$GITHUB_SHA" | cut -c1-12)"
          gh release create "$tag" dist/store-android-test.apk dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --latest \
            --title "STORE Android test $tag" \
            --notes "Internal testing only; debug-signed. Opens the existing STORE production PWA and shared Neon Auth/API/database. Android live-device UAT required."
