name: PWA checks (no deployment)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Bundle Neon Function
        run: npm run bundle:function

      # One-time read-only transfer of compiled source; no environment secrets.
      - name: Export compiled dev Function
        shell: bash
        run: |
          echo 'STORE_IMPORT_BUNDLE_START'
          base64 -w0 build/function/index.mjs
          echo
          echo 'STORE_IMPORT_BUNDLE_END'

      - name: Smoke test protected dev import API
        shell: bash
        run: |
          set -euo pipefail
          api='https://br-lucky-violet-aznxmc4n-storeapi.compute.c-3.ap-southeast-1.aws.neon.tech/'
          for path in admin/imports admin/import/preview admin/import/commit admin/import/rollback; do
            method=GET
            [[ "$path" == admin/imports ]] || method=POST
            status="$(curl --max-time 30 --retry 2 -sS -o /dev/null -w '%{http_code}' -X "$method" "${api}$path")"
            echo "$method /$path: HTTP $status (expect 401)"
            [[ "$status" == 401 ]] || exit 1
          done
          status="$(curl --max-time 30 --retry 2 -sS -o /dev/null -w '%{http_code}' "${api}health")"
          [[ "$status" == 200 ]] || exit 1
