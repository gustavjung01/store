name: PWA checks (no deployment)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Bundle Neon Function
        run: npm run bundle:function
      - name: Smoke test Neon development Function
        if: github.event.pull_request.head.repo.full_name == 'gustavjung01/store'
        shell: bash
        run: |
          set -euo pipefail
          base='https://br-lucky-violet-aznxmc4n-storeapi.compute.c-3.ap-southeast-1.aws.neon.tech/'
          health="$(curl --max-time 30 --retry 2 --silent --show-error --output /tmp/store-health.txt --write-out '%{http_code}' "${base}health")"
          echo "Health HTTP status: $health"
          if [[ "$health" != '200' ]]; then
            echo '::error::Neon development Function did not pass health check'
            exit 1
          fi
          denied="$(curl --max-time 30 --retry 2 --silent --show-error --output /tmp/store-me.txt --write-out '%{http_code}' "${base}me")"
          echo "Unauthenticated /me HTTP status: $denied"
          if [[ "$denied" != '401' ]]; then
            echo '::error::Neon development Function did not deny anonymous access'
            exit 1
          fi
