name: PWA checks (no deployment)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Bundle Neon Function
        run: npm run bundle:function

      # Temporary one-time handoff of public, compiled source only (NO ENV/SECRETS).
      - name: Transport dev Function bundle
        if: github.event.pull_request.head.repo.full_name == 'gustavjung01/store'
        shell: bash
        run: |
          echo 'STORE_FUNCTION_BUNDLE_START'
          base64 -w0 build/function/index.mjs
          printf '\nSTORE_FUNCTION_BUNDLE_END\n'
