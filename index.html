<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#f5f7fb" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="STORE — Tra mã, xem giá và tồn kho theo lần nhập Excel." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>STORE — Tra giá & tồn kho</title>
    <script>
      // Apply the saved/system theme before the app or styles paint. Never store account data.
      (function () {
        var preference;
        try { preference = localStorage.getItem('store-theme'); } catch (_) {}
        var dark = preference === 'dark' || (preference !== 'light' && window.matchMedia &&
          window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#0d1118' : '#f5f7fb');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
